<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone JS - Physics & Steve Fixed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background-color: #78A7FF; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Mirino centratissimo */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); mix-blend-mode: difference;
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        /* Loading Overlay */
        #loading {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #111; color: #fff; display: flex;
            justify-content: center; align-items: center; font-size: 28px;
            z-index: 100; transition: opacity 0.3s;
        }

        /* Hotbar */
        #hotbar {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; background: rgba(0, 0, 0, 0.65); padding: 5px;
            border: 2px solid #222; border-radius: 4px; z-index: 20;
        }
        .slot {
            width: 46px; height: 46px; background: #777; cursor: pointer;
            border: 2px solid #444;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.5), inset 2px 2px 0px rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .slot.active { border: 2px solid #fff; box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3), inset 2px 2px 0px rgba(255,255,255,0.6); }
        .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
        .slot-num { position: absolute; top: 2px; left: 4px; font-size: 11px; color: white; text-shadow: 1px 1px 0 #000; font-weight: bold; }

        #instructions {
            position: absolute; top: 12px; left: 12px; color: white;
            text-shadow: 1px 1px 0 #000; pointer-events: none; font-size: 13px; z-index: 20;
        }
    </style>
</head>
<body>

    <div id="loading">Caricamento Mondo...</div>
    <div id="crosshair"></div>
    <div id="instructions">
        Click: Gioca/Piazza/Rompi | WASD: Muovi | Spazio: Salta | Spazio x2: Volo (Spazio=Sali, Shift=Scendi) | 1-6: Seleziona | E: Mouse
    </div>
    
    <div id="hotbar">
        <div class="slot active" onclick="selectBlock(1, this)"><div class="slot-num">1</div><canvas id="ui-tex-1"></canvas></div>
        <div class="slot" onclick="selectBlock(2, this)"><div class="slot-num">2</div><canvas id="ui-tex-2"></canvas></div>
        <div class="slot" onclick="selectBlock(3, this)"><div class="slot-num">3</div><canvas id="ui-tex-3"></canvas></div>
        <div class="slot" onclick="selectBlock(4, this)"><div class="slot-num">4</div><canvas id="ui-tex-4"></canvas></div>
        <div class="slot" onclick="selectBlock(5, this)"><div class="slot-num">5</div><canvas id="ui-tex-5"></canvas></div>
        <div class="slot" onclick="selectBlock(6, this)"><div class="slot-num">6</div><canvas id="ui-tex-6"></canvas></div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // 1. SCENA E GRUPPO MONDO SEPARATO
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78A7FF); 
        scene.fog = new THREE.Fog(0x78A7FF, 20, 50);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        const controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        // 2. CORPO DI STEVE PER IL GIOCATORE
        const playerBody = new THREE.Group();
        
        const torsoMat = new THREE.MeshLambertMaterial({ color: 0x00AAAA });
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), torsoMat);
        torso.position.set(0, -0.75, 0);

        const legMat = new THREE.MeshLambertMaterial({ color: 0x0000AA });
        const legs = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), legMat);
        legs.position.set(0, -1.45, 0);

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xFFCC99 });
        const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), skinMat);
        lArm.position.set(-0.4, -0.75, 0);
        const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), skinMat);
        rArm.position.set(0.4, -0.75, 0);

        playerBody.add(torso, legs, lArm, rArm);
        controls.getObject().add(playerBody);

        // 3. TEXTURE ALPHA IN PIXEL ART
        function createTexture(type, drawToUI = null) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');

            const fill = (r, g, b) => { ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(0, 0, 16, 16); };
            const noise = (intensity) => {
                const img = ctx.getImageData(0, 0, 16, 16);
                for(let i=0; i<img.data.length; i+=4) {
                    let val = (Math.random() - 0.5) * intensity;
                    img.data[i] = Math.min(255, Math.max(0, img.data[i] + val));
                    img.data[i+1] = Math.min(255, Math.max(0, img.data[i+1] + val));
                    img.data[i+2] = Math.min(255, Math.max(0, img.data[i+2] + val));
                }
                ctx.putImageData(img, 0, 0);
            };

            if (type === 'dirt') { fill(134, 96, 67); noise(25); } 
            else if (type === 'grass_top') { fill(118, 172, 79); noise(25); } 
            else if (type === 'grass_side') {
                fill(134, 96, 67); noise(25);
                ctx.fillStyle = '#76ac4f';
                for(let i=0; i<16; i++) ctx.fillRect(i, 0, 1, Math.random() * 4 + 3);
            } 
            else if (type === 'stone') { fill(125, 125, 125); noise(35); } 
            else if (type === 'bedrock') { fill(60, 60, 60); noise(80); } 
            else if (type === 'wood') {
                fill(102, 81, 51); noise(15);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                for(let i=0; i<16; i+=4) ctx.fillRect(i, 0, 1, 16);
            } 
            else if (type === 'leaves') { fill(58, 133, 40); noise(40); } 
            else if (type === 'glass') {
                ctx.clearRect(0,0,16,16);
                ctx.fillStyle = 'rgba(230, 245, 255, 0.25)'; ctx.fillRect(0,0,16,16);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(0,0,16,1); ctx.fillRect(0,15,16,1); ctx.fillRect(0,0,1,16); ctx.fillRect(15,0,1,16);
            } 
            else if (type === 'brick') {
                fill(175, 75, 65); noise(20);
                ctx.fillStyle = '#ccc';
                for(let y=0; y<16; y+=4) ctx.fillRect(0, y, 16, 1);
            }

            if (drawToUI) {
                const uiCtx = document.getElementById(drawToUI).getContext('2d');
                document.getElementById(drawToUI).width = 16;
                document.getElementById(drawToUI).height = 16;
                uiCtx.drawImage(canvas, 0, 0);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const matDirt = new THREE.MeshLambertMaterial({ map: createTexture('dirt', 'ui-tex-6') });
        const matGrassSide = new THREE.MeshLambertMaterial({ map: createTexture('grass_side') });
        const matGrassTop = new THREE.MeshLambertMaterial({ map: createTexture('grass_top', 'ui-tex-1') });
        const matStone = new THREE.MeshLambertMaterial({ map: createTexture('stone', 'ui-tex-2') });
        const matBedrock = new THREE.MeshLambertMaterial({ map: createTexture('bedrock') });
        const matWood = new THREE.MeshLambertMaterial({ map: createTexture('wood', 'ui-tex-3') });
        const matLeaves = new THREE.MeshLambertMaterial({ map: createTexture('leaves') });
        const matGlass = new THREE.MeshLambertMaterial({ map: createTexture('glass', 'ui-tex-4'), transparent: true });
        const matBrick = new THREE.MeshLambertMaterial({ map: createTexture('brick', 'ui-tex-5') });

        const grassArray = [matGrassSide, matGrassSide, matGrassTop, matDirt, matGrassSide, matGrassSide];
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        
        const getMaterial = (type) => {
            switch(type) {
                case 1: return grassArray;
                case 2: return matStone;
                case 3: return matWood;
                case 4: return matGlass;
                case 5: return matBrick;
                case 6: return matDirt;
                case 7: return matBedrock;
                case 8: return matLeaves;
            }
        };

        let currentBlockType = 1;
        window.selectBlock = (type, el) => {
            currentBlockType = type;
            document.querySelectorAll('.slot').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            else document.querySelectorAll('.slot')[type-1].classList.add('active');
        }

        // 4. GENERAZIONE TERRENO OTTIMIZZATA
        const chunkSize = 16;
        const renderDistance = 2; 
        const chunks = new Map(); 
        const blocks = new Map(); 
        const chunkQueue = []; 

        function getBlockKey(x, y, z) { return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; }
        function getChunkKey(cx, cz) { return `${cx},${cz}`; }

        function noise(x, z) { return (Math.sin(x * 0.1) + Math.cos(z * 0.1) + Math.sin(x * 0.05 + z * 0.05)) * 2; }

        function generateChunk(cx, cz) {
            const chunkKey = getChunkKey(cx, cz);
            if (chunks.has(chunkKey)) return;
            
            const chunkGroup = new THREE.Group();
            const startX = cx * chunkSize;
            const startZ = cz * chunkSize;

            for (let x = 0; x < chunkSize; x++) {
                for (let z = 0; z < chunkSize; z++) {
                    const worldX = startX + x;
                    const worldZ = startZ + z;
                    const elevation = Math.floor(noise(worldX, worldZ)) + 12; 

                    addBlockToChunk(worldX, 0, worldZ, 7, chunkGroup);
                    
                    for(let y = Math.max(1, elevation - 4); y <= elevation; y++) {
                        if (y === elevation) {
                            addBlockToChunk(worldX, y, worldZ, 1, chunkGroup);
                        } else if (y >= elevation - 2) {
                            addBlockToChunk(worldX, y, worldZ, 6, chunkGroup);
                        } else {
                            addBlockToChunk(worldX, y, worldZ, 2, chunkGroup);
                        }
                    }

                    if (Math.random() < 0.01 && elevation > 11) {
                        const treeHeight = Math.floor(Math.random() * 3) + 4;
                        for (let ty = 1; ty <= treeHeight; ty++) addBlockToChunk(worldX, elevation + ty, worldZ, 3, chunkGroup);
                        for (let lx = -1; lx <= 1; lx++) {
                            for (let lz = -1; lz <= 1; lz++) {
                                addBlockToChunk(worldX + lx, elevation + treeHeight, worldZ + lz, 8, chunkGroup);
                                addBlockToChunk(worldX + lx, elevation + treeHeight + 1, worldZ + lz, 8, chunkGroup);
                            }
                        }
                    }
                }
            }
            worldGroup.add(chunkGroup);
            chunks.set(chunkKey, chunkGroup);
        }

        function addBlockToChunk(x, y, z, type, group) {
            const mesh = new THREE.Mesh(geometry, getMaterial(type));
            mesh.position.set(x, y, z);
            mesh.matrixAutoUpdate = false; 
            mesh.updateMatrix();
            group.add(mesh);
            blocks.set(getBlockKey(x, y, z), mesh);
        }

        function queueChunks() {
            const px = Math.floor(controls.getObject().position.x / chunkSize);
            const pz = Math.floor(controls.getObject().position.z / chunkSize);

            for (let x = -renderDistance; x <= renderDistance; x++) {
                for (let z = -renderDistance; z <= renderDistance; z++) {
                    const cx = px + x; const cz = pz + z;
                    const chunkKey = getChunkKey(cx, cz);
                    if (!chunks.has(chunkKey) && !chunkQueue.some(q => q.x === cx && q.z === cz)) {
                        chunkQueue.push({x: cx, z: cz});
                    }
                }
            }

            chunks.forEach((group, key) => {
                const [cx, cz] = key.split(',').map(Number);
                if (Math.abs(cx - px) > renderDistance + 1 || Math.abs(cz - pz) > renderDistance + 1) {
                    worldGroup.remove(group); chunks.delete(key);
                    group.children.forEach(mesh => blocks.delete(getBlockKey(mesh.position.x, mesh.position.y, mesh.position.z)));
                }
            });
        }

        // 5. MOVIMENTO E FISICA CORRETTI
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let moveUp = false, moveDown = false;
        let canJump = false, isFlying = false;
        let velocityY = 0;
        let lastSpaceTime = 0;

        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': 
                    const now = Date.now();
                    if (now - lastSpaceTime < 280) { 
                        isFlying = !isFlying;
                        velocityY = 0;
                    } else {
                        if (isFlying) {
                            moveUp = true;
                        } else if (canJump) {
                            velocityY = 8.5; 
                            canJump = false;
                        }
                    }
                    lastSpaceTime = now; break;
                case 'ShiftLeft': if (isFlying) moveDown = true; break;
                case 'KeyE': 
                    if(controls.isLocked) controls.unlock(); else controls.lock(); 
                    break;
                case 'Digit1': selectBlock(1); break;
                case 'Digit2': selectBlock(2); break;
                case 'Digit3': selectBlock(3); break;
                case 'Digit4': selectBlock(4); break;
                case 'Digit5': selectBlock(5); break;
                case 'Digit6': selectBlock(6); break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = false; break; case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break; case 'KeyD': moveRight = false; break;
                case 'Space': moveUp = false; break;
                case 'ShiftLeft': moveDown = false; break;
            }
        });

        // PIAZZA ED ELIMINA BLOCCHI (Senza colpire Steve)
        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('.slot')) return;
            if (!controls.isLocked) { controls.lock(); return; }

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Interseca solo con i blocchi del mondo
            const intersects = raycaster.intersectObjects(worldGroup.children, true);
            
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];
                const blockMesh = intersect.object;

                if (e.button === 0) { // Rompi
                    if (blockMesh.material !== matBedrock) { 
                        blockMesh.parent.remove(blockMesh);
                        blocks.delete(getBlockKey(blockMesh.position.x, blockMesh.position.y, blockMesh.position.z));
                    }
                } else if (e.button === 2) { // Piazza
                    const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    const newPos = new THREE.Vector3(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                    
                    const pPos = controls.getObject().position;
                    if (Math.abs(newPos.x - pPos.x) < 0.8 && Math.abs(newPos.z - pPos.z) < 0.8 && newPos.y >= pPos.y - 1.5 && newPos.y <= pPos.y + 0.5) return; 

                    const newMesh = new THREE.Mesh(geometry, getMaterial(currentBlockType));
                    newMesh.position.copy(newPos);
                    newMesh.matrixAutoUpdate = false; newMesh.updateMatrix();
                    worldGroup.add(newMesh); 
                    blocks.set(getBlockKey(newPos.x, newPos.y, newPos.z), newMesh);
                }
            }
        });

        // CONTROLLO COLLISIONI PARETI
        function checkHorizontalCollision(pos) {
            const pad = 0.25;
            const checkCoords = [
                [pos.x - pad, pos.z - pad], [pos.x + pad, pos.z - pad],
                [pos.x - pad, pos.z + pad], [pos.x + pad, pos.z + pad]
            ];
            const headY = Math.round(pos.y - 0.4);
            const bodyY = Math.round(pos.y - 1.1);
            
            for (let c of checkCoords) {
                const bx = Math.round(c[0]); const bz = Math.round(c[1]);
                if (blocks.has(getBlockKey(bx, bodyY, bz)) || blocks.has(getBlockKey(bx, headY, bz))) {
                    return true;
                }
            }
            return false;
        }

        // 6. LOOP PRINCIPALE
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1); 

            if (chunkQueue.length > 0) {
                const chunk = chunkQueue.shift();
                generateChunk(chunk.x, chunk.z);
            }

            if (controls.isLocked) {
                const playerPos = controls.getObject().position;
                const walkSpeed = isFlying ? 12 : 6;
                
                // Direzione WASD
                const moveVector = new THREE.Vector3();
                if (moveForward) moveVector.z += 1;
                if (moveBackward) moveVector.z -= 1;
                if (moveLeft) moveVector.x -= 1;
                if (moveRight) moveVector.x += 1;
                moveVector.normalize();

                if (moveVector.lengthSq() > 0) {
                    const oldX = playerPos.x;
                    const oldZ = playerPos.z;

                    controls.moveRight(moveVector.x * walkSpeed * delta);
                    controls.moveForward(moveVector.z * walkSpeed * delta);

                    if (checkHorizontalCollision(playerPos)) {
                        playerPos.x = oldX;
                        playerPos.z = oldZ;
                    }
                }

                // Gestione Volo / Gravità
                if (isFlying) {
                    let flySpeedY = 0;
                    if (moveUp) flySpeedY = 8;
                    if (moveDown) flySpeedY = -8;
                    playerPos.y += flySpeedY * delta;
                } else {
                    velocityY -= 26.0 * delta; 
                    playerPos.y += velocityY * delta;

                    // Collisione terreno
                    const feetY = playerPos.y - 1.6;
                    const samplePoints = [
                        [playerPos.x - 0.2, playerPos.z - 0.2], [playerPos.x + 0.2, playerPos.z - 0.2],
                        [playerPos.x - 0.2, playerPos.z + 0.2], [playerPos.x + 0.2, playerPos.z + 0.2],
                        [playerPos.x, playerPos.z]
                    ];

                    let grounded = false;
                    for (let pt of samplePoints) {
                        const bx = Math.round(pt[0]);
                        const by = Math.floor(feetY + 0.15);
                        const bz = Math.round(pt[1]);

                        if (blocks.has(getBlockKey(bx, by, bz))) {
                            const blockTop = by + 0.5;
                            if (feetY <= blockTop && velocityY <= 0) {
                                playerPos.y = blockTop + 1.6;
                                velocityY = 0;
                                canJump = true;
                                grounded = true;
                                break;
                            }
                        }
                    }
                    if (!grounded) canJump = false;
                }

                if (playerPos.y < -10) { playerPos.set(0, 25, 0); velocityY = 0; }
                queueChunks(); 
            }

            renderer.render(scene, camera); 
            prevTime = time;
        }

        // Avvio
        controls.getObject().position.set(0, 25, 0); 
        generateChunk(0, 0);
        
        const loadingScreen = document.getElementById('loading');
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 300);

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
